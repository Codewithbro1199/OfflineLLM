name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        id: toolchain
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::warning title=Xcode::No Xcode 26 found; using default. App Store uploads need Xcode 26."
          else
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          VERSION=$(xcodebuild -version | tr '\n' ' ')
          echo "::notice title=Toolchain::$VERSION | $(cmake --version | head -1) | available: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          mkdir -p build

      - name: Restore llama.xcframework
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: llama-xcframework-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('scripts/llama-version.txt', 'scripts/build-llama.sh') }}

      - name: Build llama.xcframework (first run only, ~20-40 min)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash scripts/build-llama.sh 2>&1 | tee build/llama.log \
            || { bash scripts/annotate-failure.sh build/llama.log "llama.cpp build failed"; exit 1; }

      - name: Save llama.xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Run unit tests (Simulator)
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          echo "Using simulator $SIM_ID"
          set -o pipefail
          xcodebuild test \
            -project Offgrid.xcodeproj -scheme Offgrid \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log | xcbeautify --renderer github-actions \
            || { bash scripts/annotate-failure.sh build/test.log "Tests failed"; exit 1; }

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Offgrid.xcodeproj -scheme Offgrid -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/device.log | xcbeautify --renderer github-actions \
            || { bash scripts/annotate-failure.sh build/device.log "iPhone build failed"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Offgrid.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Offgrid-unsigned.ipa Payload)
          echo "::notice title=IPA::$(ls -lh build/Offgrid-unsigned.ipa | awk '{print $5}')"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Offgrid-unsigned-ipa
          path: build/Offgrid-unsigned.ipa
          retention-days: 14
