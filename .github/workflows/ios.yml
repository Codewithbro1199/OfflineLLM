name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          cmake --version | head -1
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore llama.xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor
          key: llama-xcframework-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('scripts/llama-version.txt', 'scripts/build-llama.sh') }}

      - name: Build llama.xcframework (first run only, ~20 min)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-llama.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
          mkdir -p build

      - name: Run unit tests (Simulator)
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          echo "Using simulator $SIM_ID"
          set -o pipefail
          xcodebuild test \
            -project Offgrid.xcodeproj -scheme Offgrid \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO | tee build/test.log | xcbeautify || (tail -200 build/test.log; exit 1)

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Offgrid.xcodeproj -scheme Offgrid -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/device.log | xcbeautify || (tail -200 build/device.log; exit 1)
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Offgrid.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Offgrid-unsigned.ipa Payload)
          ls -lh build/Offgrid-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Offgrid-unsigned-ipa
          path: build/Offgrid-unsigned.ipa
          retention-days: 14
